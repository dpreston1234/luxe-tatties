# =============================================================================
# Pages CMS configuration
#
# This file decides what Van sees when she logs in at app.pagescms.org.
# Every field below becomes a labelled box in her editor. Anything NOT listed
# here she cannot touch — which is the point. She can rewrite every word and
# swap every photo without ever seeing HTML, and she cannot break the layout.
#
# To add a new editable thing, it takes three steps:
#   1. add the field to the matching file in /content
#   2. use it in build.mjs
#   3. add it here so it shows up in the CMS
# =============================================================================

media:
  input: assets/images
  output: /assets/images
  categories: [image]

content:
  # ---------------------------------------------------------------- settings
  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    icon: settings
    description: Logo, links, and the Instagram / reviews widgets. Applies to every page.
    fields:
      - name: logo
        label: Logo
        type: image
        description: Shown in the header and footer. PNG with a transparent background works best.
      - name: logo_alt
        label: Logo description
        type: string
        description: Read aloud to blind visitors. Just the business name is fine.
      - name: booking_url
        label: Booking calendar address
        type: string
        description: Your Acuity link. The calendar embedded on the site comes from here.
      - name: book_button_label
        label: "\"Book Now\" button text"
        type: string
      - name: instagram_main
        label: Instagram link (main)
        type: string
      - name: instagram_main_handle
        label: Instagram handle (main)
        type: string
      - name: instagram_alt
        label: Instagram link (second account)
        type: string
      - name: instagram_alt_handle
        label: Instagram handle (second account)
        type: string
      - name: city
        label: City
        type: string
      - name: legal_name
        label: Legal business name
        type: string
        description: Shown in the copyright line at the very bottom.
      - name: footer_blurb
        label: Footer description
        type: text
      - name: instagram_widget
        label: Instagram feed embed code
        type: code
        options:
          language: html
        description: >
          Paste the code from your Instagram feed widget here. Leave empty and a
          "Follow on Instagram" box shows instead. Nothing breaks either way.
      - name: reviews_widget
        label: Google reviews embed code
        type: code
        options:
          language: html
        description: >
          Paste the code from your Google Reviews widget here. Leave empty and a
          placeholder box shows instead.

  # -------------------------------------------------------------------- home
  - name: home
    label: Home page
    type: file
    path: content/home.json
    icon: home
    fields:
      - name: title
        label: Browser tab title
        type: string
      - name: description
        label: Google search description
        type: text
        description: The grey text under your link in Google results. Aim for 1-2 sentences.
      - name: hero_eyebrow
        label: Small label above the headline
        type: string
      - name: hero_heading
        label: Main headline
        type: string
      - name: hero_heading_italic
        label: Second line (shown in italic gold)
        type: string
      - name: hero_text
        label: Intro paragraph
        type: text
      - name: hero_image
        label: Main photo
        type: image
      - name: hero_image_alt
        label: Main photo description
        type: string
      - name: hero_button_1_label
        label: First button text
        type: string
      - name: hero_button_1_link
        label: First button link
        type: string
      - name: hero_button_2_label
        label: Second button text
        type: string
      - name: hero_button_2_link
        label: Second button link
        type: string
      - name: paths_eyebrow
        label: "Section 2 — small label"
        type: string
      - name: paths_heading
        label: "Section 2 — heading"
        type: string
      - name: paths
        label: "Section 2 — the two cards"
        type: object
        list: true
        fields:
          - name: badge
            label: Pill label
            type: string
          - name: title
            label: Card title
            type: string
          - name: text
            label: Card text
            type: text
          - name: button_label
            label: Button text
            type: string
          - name: button_link
            label: Button link
            type: string
          - name: featured
            label: Highlight this card
            type: boolean
      - name: reviews_eyebrow
        label: "Reviews — small label"
        type: string
      - name: reviews_heading
        label: "Reviews — heading"
        type: string
      - name: gallery_eyebrow
        label: "Gallery — small label"
        type: string
      - name: gallery_heading
        label: "Gallery — heading"
        type: string
      - name: gallery
        label: "Gallery — photos"
        type: object
        list: true
        description: Add, remove or reorder. Leave a photo empty to show a placeholder box.
        fields:
          - name: image
            label: Photo
            type: image
          - name: alt
            label: Photo description
            type: string
          - name: size
            label: Tile shape
            type: select
            options:
              values:
                - { value: tile-wide, label: Wide }
                - { value: tile-tall, label: Tall }
                - { value: tile-sq, label: Square }
      - name: gallery_button_label
        label: "Gallery — button text"
        type: string
      - name: instagram_eyebrow
        label: "Instagram — small label"
        type: string
      - name: instagram_heading
        label: "Instagram — heading"
        type: string
      - name: closing_heading
        label: "Closing — heading"
        type: string
      - name: closing_text
        label: "Closing — text"
        type: text

