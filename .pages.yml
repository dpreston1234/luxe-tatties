        label: Your workshops
        type: object
        list: true
        description: Add or remove workshops here. Each one becomes a card with its own price and Book button.
        fields:
          - name: badge
            label: Pill label
            type: string
            description: 'Small tag at the top, e.g. "Most popular". Leave empty for none.'
          - name: title
            label: Workshop name
            type: string
          - name: text
            label: Description
            type: text
          - name: price
            label: Price
            type: string
            description: 'Type it exactly as you want it shown, e.g. "$450" or "From $450".'
          - name: duration
            label: Duration
            type: string
            description: 'e.g. "3 hours" or "2 days".'
          - name: button_label
            label: Button text
            type: string
          - name: button_link
            label: Button link
            type: string
            description: 'Use "#booking" to jump to the calendar on this page.'
          - name: featured
            label: Highlight this workshop
            type: boolean
      - name: options_note
        label: Small note under the workshops
        type: text
        description: Leave empty to hide it.
      - name: why_eyebrow
        label: "Why section — small label"
        type: string
      - name: why_heading
        label: "Why section — heading"
        type: string
      - name: steps
        label: "Why section — numbered points"
        type: object
        list: true
        fields:
          - name: title
            label: Point title
            type: string
          - name: text
            label: Point text
            type: text
      - name: callout_title
        label: "Highlighted box — title"
        type: string
        description: Leave empty to hide the whole box.
      - name: callout_text
        label: "Highlighted box — text"
        type: text
      - name: callout_note
        label: "Highlighted box — small print"
        type: text
      - name: booking_eyebrow
        label: "Calendar — small label"
        type: string
      - name: booking_heading
        label: "Calendar — heading"
        type: string

